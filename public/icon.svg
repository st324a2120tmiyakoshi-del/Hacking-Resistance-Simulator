<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Cyber Grid Lines -->
  <path d="M64 256 H448 M256 64 V448" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Shield Shape with Neon Glow -->
  <g filter="url(#neonGlow)">
    <path d="M256 80 L384 136 C384 272 256 384 256 424 C256 384 128 272 128 136 Z" 
          fill="none" 
          stroke="url(#shieldGrad)" 
          stroke-width="16" 
          stroke-linejoin="round" />
  </g>

  <!-- Shield Internal Fill -->
  <path d="M256 96 L368 146 C368 262 256 362 256 400 C256 362 144 262 144 146 Z" 
        fill="#06b6d4" 
        fill-opacity="0.12" />

  <!-- Padlock Core Inside Shield -->
  <!-- Shackle -->
  <path d="M216 230 V196 C216 174 234 156 256 156 C278 156 296 174 296 196 V230" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="14" 
        stroke-linecap="round" />

  <!-- Lock Body -->
  <rect x="196" y="230" width="120" height="96" rx="18" 
        fill="url(#bgGrad)" 
        stroke="#38bdf8" 
        stroke-width="8" />

  <!-- Keyhole -->
  <circle cx="256" cy="270" r="10" fill="#38bdf8" />
  <polygon points="252,270 260,270 264,296 248,296" fill="#38bdf8" />

  <!-- Checkmark / Pulse nodes -->
  <circle cx="384" cy="136" r="8" fill="#10b981" />
  <circle cx="128" cy="136" r="8" fill="#10b981" />
  <circle cx="256" cy="424" r="8" fill="#10b981" />
</svg>
